theme: jekyll-theme-cayman
title: Horizon AI 日报
description: 每天 07:00 自动生成的 AI 领域双语日报 · AI-curated daily digest since 2026
baseurl: "/Horizon" # the subpath of your site, e.g. /blog
url: "https://siweimidu.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
